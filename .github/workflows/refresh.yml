name: Refresh LUG data

# One long run keeps the data fresh: a fast refresh every 15 minutes and a full refresh
# once a day (after 3am Toronto). GitHub often skips short scheduled runs, so instead each
# run loops for nearly 6 hours, and these triggers just make sure a new loop starts when
# the last one ends. Results go to the "data" branch, which the app reads directly.
on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "first refresh: fast or full (later ones decide for themselves)"
        default: fast
        required: true

concurrency:
  group: lug-refresh
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 358
    env:
      SITE_URL: https://karsonhicks2005-blip.github.io/lug-sports
      DATA_RAW: https://raw.githubusercontent.com/karsonhicks2005-blip/lug-sports/data
      DATA_SOURCE: ${{ vars.DATA_SOURCE || 'site' }}
      DS_API_BASE: ${{ secrets.DS_API_BASE }}
      DS_API_KEY: ${{ secrets.DS_API_KEY }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      FORCE_MODE: ${{ inputs.mode }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Install browser
        if: env.DATA_SOURCE != 'api'
        run: npx playwright install --with-deps chromium

      - name: Refresh every 15 minutes for the next ~6 hours
        run: bash scraper/loop.sh
