<style>
/* Layout: one phone-width app column (max 460px) centred on a black ground; sticky bottom tab bar. Single dark look, LUG black + orange. */
:root {
  --ground: #050505;
  --bg: #0b0b0b;
  --surface: #161616;
  --surface-2: #1f1f1f;
  --line: #2b2b2b;

  --loss: #fca5a5;
  --loss-bg: #3a1618;
  --tie-bg: #2f2f33;
  --display: "Roboto Condensed", "Arial Narrow", Arial, sans-serif;

:focus-visible { outline: 2px solid var(--orange); outline-offset: 2px; }
.app { max-width: 460px; margin: 0 auto; min-height: calc(100vh - env(safe-area-inset-top, 0px)); min-height: calc(100dvh - env(safe-area-inset-top, 0px)); background: var(--bg); display: flex; flex-direction: column; border-left: 1px solid #141414; border-right: 1px solid #141414; }
.scroll { flex: 1; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 16px 24px; display: flex; flex-direction: column; gap: 14px; }
.topbar { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 48px; }

.iconbtn svg { width: 20px; height: 20px; }

.pad { padding: 14px 16px; }
.row { display: flex; align-items: center; gap: 12px; }
.grow { flex: 1; min-width: 0; }

/* Sport tiles */
.tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.tile { position: relative; display: block; height: 150px; border-radius: 14px; overflow: hidden; background: var(--surface-2); border: 0; padding: 0; text-align: left; }

.tag { padding: 3px 7px; border-radius: 4px; font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; background: var(--orange); color: var(--orange-ink); }
.tag.dark { background: #000; color: var(--muted); }
.tname { padding: 4px 8px; border-radius: 4px; background: #000; color: #fff; font-family: var(--display); font-weight: 800; font-size: 16px; text-transform: uppercase; letter-spacing: .02em; }

.search { display: flex; align-items: center; gap: 10px; height: 48px; padding: 0 14px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }

.btn.pri { background: var(--orange); color: var(--orange-ink); border-color: var(--orange); }

.pill .dot img { width: 100%; height: 100%; object-fit: cover; }

.teamcard .body { padding: 14px 16px 16px; display: flex; flex-direction: column; gap: 14px; }
.teamcard h1 { margin: 0; font-family: var(--display); font-weight: 800; font-size: 28px; line-height: 1; text-transform: uppercase; text-wrap: balance; overflow-wrap: anywhere; }

.stat { background: var(--wash-2); border-radius: 12px; padding: 10px 12px; display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.stat .k { font-size: 11px; color: var(--wash-ink); text-transform: uppercase; letter-spacing: .06em; }
.stat .v { font-family: var(--display); font-weight: 700; font-size: 26px; line-height: 1.05; font-variant-numeric: tabular-nums; }
.nextgame { padding: 16px; display: flex; flex-direction: column; gap: 10px; }
.matchup { font-family: var(--display); font-weight: 700; font-size: 26px; line-height: 1.05; overflow-wrap: anywhere; }
.badge { flex: none; min-width: 60px; text-align: center; padding: 6px 9px; border-radius: 10px; font-family: var(--display); font-weight: 700; font-size: 16px; font-variant-numeric: tabular-nums; }
.badge.W { background: var(--win-bg); color: var(--win); }
.badge.L { background: var(--loss-bg); color: var(--loss); }
.badge.T { background: var(--tie-bg); color: #e5e5ea; }
.badge.time { background: none; color: var(--fg); font-family: var(--body); font-size: 13px; font-weight: 600; min-width: 0; padding: 0; text-align: right; }
.quick { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.quick button { text-align: left; padding: 14px; display: flex; flex-direction: column; gap: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; color: var(--fg); }
.quick .q1 { font-weight: 700; }
.quick .q2 { font-size: 12px; color: var(--muted); }

/* Segments & tables */
.seg { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 4px; padding: 4px; background: var(--surface); border-radius: 12px; }
.seg button { min-height: 40px; border: 0; border-radius: 9px; background: transparent; color: var(--muted); font-weight: 700; font-size: 14px; }
.seg button[aria-selected="true"] { background: var(--orange); color: var(--orange-ink); }
.datehead { padding: 6px 2px 0; }
.game { display: flex; align-items: center; gap: 14px; padding: 12px 14px; width: 100%; text-align: left; color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: 14px; }
.game .d { width: 46px; flex: none; display: flex; flex-direction: column; align-items: center; }

.tablewrap { overflow-x: auto; border-radius: 16px; border: 1px solid var(--line); background: var(--surface); }
table.st { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: 14px; }
table.st th { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; text-align: right; padding: 10px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
table.st td { padding: 0 8px; height: 46px; text-align: right; border-bottom: 1px solid #1f1f1f; white-space: nowrap; }

table.st td.tm { max-width: 170px; overflow: hidden; text-overflow: ellipsis; }
table.st tr.me td { background: var(--orange-wash); font-weight: 700; }
table.st tr.me td:first-child { box-shadow: inset 3px 0 0 var(--orange); color: var(--fg); }
table.st td.pts { font-family: var(--display); font-weight: 700; font-size: 17px; }
.leader { display: flex; align-items: center; gap: 14px; padding: 16px; background: var(--orange-wash); border: 1px solid var(--orange-line); border-radius: 18px; }
.jersey { width: 52px; height: 52px; border-radius: 999px; border: 2px solid var(--orange); flex: none; display: flex; align-items: center; justify-content: center; font-family: var(--display); font-weight: 800; font-size: 21px; background: var(--wash-2); }
.leader .num { font-family: var(--display); font-weight: 800; font-size: 44px; line-height: 1; }
.rost { display: flex; align-items: center; gap: 14px; min-height: 54px; padding: 0 16px; }
.rost .no { width: 36px; flex: none; font-family: var(--display); font-weight: 800; font-size: 22px; color: var(--orange); font-variant-numeric: tabular-nums; }
.note { font-size: 13px; color: var(--muted); line-height: 1.5; }
.empty { padding: 22px 18px; text-align: center; color: var(--muted); font-size: 14px; line-height: 1.5; }

/* Game detail */
.vs { display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 10px; text-align: center; }
.vs .side { display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 0; }
.vs .nm { font-family: var(--display); font-weight: 700; font-size: 17px; line-height: 1.1; text-transform: uppercase; overflow-wrap: anywhere; }
.vs .mid { font-family: var(--display); font-weight: 800; font-size: 30px; color: var(--muted); font-variant-numeric: tabular-nums; }
.kv > div { display: flex; justify-content: space-between; gap: 12px; padding: 13px 16px; font-size: 14px; }
.kv > div + div { border-top: 1px solid var(--line); }

/* Tab bar */

.tabbar button { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; min-height: 52px; justify-content: center; border: 0; background: none; color: var(--muted); font-size: 11px; font-weight: 700; }
.tabbar button[aria-current="page"] { color: var(--orange); }
.tabbar svg { width: 22px; height: 22px; }
.chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; margin-top: -6px; }
.chip { flex: none; min-height: 36px; padding: 0 13px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); color: var(--muted); font-size: 13px; font-weight: 600; white-space: nowrap; }
.chip[aria-checked="true"] { background: var(--fg); border-color: var(--fg); color: #111; }
table.st th.sorted { color: var(--orange); }
table.st.lead td.tm { max-width: 190px; }
.brandlogo { height: 42px; width: auto; display: block; }
.crest.logo { background: #f4f4f4 !important; padding: 4px; overflow: hidden; }
.crest.logo img { width: 100%; height: 100%; object-fit: contain; display: block; }
.crest.logo.mine { box-shadow: 0 0 0 2px var(--orange); }
.crest.sm { width: 28px; height: 28px; font-size: 12px; border-radius: 8px; padding: 2px; }
.pill .dot.logo { background: #f4f4f4; padding: 3px; }
.pill .dot.logo img { object-fit: contain; }
.mini { width: 22px; height: 22px; border-radius: 6px; display: inline-flex; align-items: center; justify-content: center; vertical-align: -6px; margin-right: 8px; flex: none; overflow: hidden; font-family: var(--display); font-weight: 800; font-size: 10px; color: #fff; }
.mini.logo { background: #f4f4f4; padding: 2px; }
.mini.logo img { width: 100%; height: 100%; object-fit: contain; display: block; }
.matchup .mini { width: 30px; height: 30px; border-radius: 8px; vertical-align: -5px; }
.linkbtn { all: unset; cursor: pointer; color: var(--orange); font-weight: 700; }
.linkbtn:focus-visible { outline: 2px solid var(--orange); outline-offset: 2px; }
.pull { position: fixed; left: 50%; top: calc(8px + env(safe-area-inset-top, 0px)); transform: translate(-50%, -60px); background: var(--surface-2); color: var(--fg); border: 1px solid var(--line); font-size: 12px; font-weight: 700; padding: 8px 14px; border-radius: 999px; z-index: 30; opacity: 0; transition: opacity .15s; pointer-events: none; }
.pull.on { opacity: 1; }
.foot { line-height: 1.7; font-size: 12px; color: #8a8a8a; text-align: center; padding-top: 6px; }
.peekbar { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 14px; background: var(--surface); border: 1px dashed #4a4a4d; }
.peekbar .t2 { font-size: 12px; color: var(--muted); }
.teamlink { all: unset; cursor: pointer; color: inherit; text-decoration: underline; text-decoration-color: rgba(250,130,35,.55); text-underline-offset: 3px; }
.teamlink:hover { color: var(--orange); }
.teamlink:focus-visible { outline: 2px solid var(--orange); outline-offset: 2px; border-radius: 4px; }
table.st tr.click { cursor: pointer; }
table.st tr.click:hover td { background: var(--surface-2); }
.vs .side.btnlike { all: unset; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 0; }
.vs .side.btnlike:focus-visible { outline: 2px solid var(--orange); outline-offset: 4px; border-radius: 12px; }
.form { display: flex; flex-direction: column; }
.field { display: flex; flex-direction: column; gap: 4px; padding: 12px 16px; }
.field + .field { border-top: 1px solid var(--line); }
.field label, .field .lab { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
.field .val { font-weight: 600; font-size: 15px; display: flex; align-items: center; gap: 8px; overflow-wrap: anywhere; }
.field .lock { font-size: 10px; font-weight: 700; color: var(--orange); border: 1px solid var(--orange-line); border-radius: 4px; padding: 1px 5px; letter-spacing: .06em; text-transform: uppercase; flex: none; }
.field select, .field input { min-height: 44px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 0 12px; font-size: 16px; width: 100%; }
.steps { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 6px; color: var(--muted); font-size: 13px; line-height: 1.45; }
.steps b { color: var(--fg); font-weight: 600; }
.ok { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: 16px; background: var(--win-bg); color: var(--win); font-weight: 600; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(86px + env(safe-area-inset-bottom, 0px)); background: var(--fg); color: #111; font-weight: 600; font-size: 13px; padding: 10px 14px; border-radius: 999px; z-index: 20; max-width: calc(100% - 32px); }
@media (prefers-reduced-motion: reduce) { .tile img { transition: none; } }
</style>

      count += list.length;
      h += '<span class="eyebrow">' + g + " · " + list.length + '</span><div class="card list">';
      list.forEach(function (p) { h += '<div class="rost"><span class="no">' + esc(p.no || "–") + '</span><span class="grow ell" style="font-weight:600">' + esc(p.n) + "</span>" + (p.pos && !isHockey(c.l.k) ? '<span class="t2" style="color:var(--muted);font-size:12px">' + esc(p.pos) + "</span>" : "") + "</div>"; });
      h += "</div>";
    });
    return h + '<p class="note">' + count + " players who have played this season.</p>";
  }
  function renderGame(c) {
    var g = c.games.filter(function (x) { return x[0] === st.game; })[0];
    if (!g) { st.view = "home"; return renderHome(c); }
    var d = gdate(g), sc = scoreOf(g), r = resultFor(c, g);
    var away = findInLeague(c.l, g[3], c.city), home = findInLeague(c.l, g[4], c.city);
    function side(name, f) {
      var inner = crest(name, "lg" + (name === c.t.n ? " mine" : ""), c.l.k, f && f.t.id) + '<span class="nm">' + esc(name) + '</span><span class="sub" style="font-size:12px">' + (f ? recordStr(f.t) + (name !== c.t.n ? " · View team" : "") : "") + "</span>";
      if (f && name !== c.t.n) return '<button class="side btnlike" data-act="view-team" data-k="' + c.l.k + '" data-id="' + esc(f.t.id) + '" aria-label="View ' + esc(name) + '">' + inner + "</button>";
      return '<div class="side">' + inner + "</div>";
    }
    var h = '<div class="topbar"><button class="iconbtn" data-act="tab" data-v="' + st.prev + '" aria-label="Back">' + ICON.back + '</button><span class="eyebrow o">' + (g[9] === "PO" || /^PO/.test(String(g[9])) ? "Playoffs" : "Regular season") + "</span></div>";
    h += '<div class="hero" style="height:150px"><img src="' + IMG[c.sport.img === "mens" ? "hero" : c.sport.img] + '" alt=""></div>';
    h += '<div class="vs">' + side(g[3], away) + '<div class="mid">' + (sc ? sc[0] + "–" + sc[1] : "VS") + "</div>" + side(g[4], home) + "</div>";
    if (r) h += '<div style="text-align:center"><span class="badge ' + r.k + '">' + (r.k === "W" ? "Win" : r.k === "L" ? "Loss" : "Tie") + "</span></div>";
    h += '<div class="card kv"><div><span>Date</span><span>' + fmtDate(d) + " " + d.getFullYear() + "</span></div><div><span>Time</span><span>" + fmtTime(g) + "</span></div><div><span>Where</span><span>" + esc(g[7] || "–") + "</span></div>" + (g[8] ? "<div><span>Rink / field</span><span>" + esc(g[8]) + "</span></div>" : "") + "<div><span>Home team</span><span>" + esc(g[4]) + "</span></div><div><span>Status</span><span>" + esc(sc ? (g[6] || "Final") : "Scheduled") + "</span></div></div>";
    if (!sc) h += '<a class="btn pri block" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(g[7] + " " + c.city) + '">Directions to ' + esc(g[7]) + "</a>";
    var opp = oppOf(c, g), h2h = c.results.filter(function (x) { return x !== g && oppOf(c, x) === opp; });
    h += '<span class="eyebrow">Head to head this season</span>';
    if (!h2h.length) h += '<div class="card empty" style="padding:16px">First meeting this season.</div>';
    else { h += '<div class="card list">'; h2h.forEach(function (x) { var rr = resultFor(c, x); h += '<div class="rost"><span class="badge ' + rr.k + '">' + rr.text + '</span><span class="grow sub">' + fmtDate(gdate(x)) + "</span></div>"; }); h += "</div>"; }
    return h;
  }
  function titleCase(s) { return String(s).toLowerCase().replace(/\b([a-z])/g, function (m) { return m.toUpperCase(); }).replace(/\bOa\b/, "OA"); }
  function renderSignup(c) {
    var h = subhead(c, "Sign Up");
    var member = load(memberKey(c), false);
    if (member) {
      h += '<div class="ok">' + ICON.check + '<span class="grow">You’re on ' + esc(c.t.n) + "</span></div>";
      h += '<p class="note">Need to change your registration or payment? That’s done in your LUG account.</p>';
      h += '<a class="btn pri block" target="_blank" rel="noopener" href="https://my.hockeyshift.com/#/login">Open my LUG account</a>';
      h += '<button class="btn block" data-act="member" data-v="0">I’m not on this team</button>';
      return h;
    }
    // Already on it?
    var roster = c.players.map(function (p) { return p[1]; }).concat(c.goalies.map(function (p) { return p[1]; })).filter(function (n, i, a) { return a.indexOf(n) === i; });
    h += '<span class="eyebrow">Already on ' + esc(c.t.n) + "?</span>";
    if (roster.length) {
      h += '<div class="card form"><div class="field"><label for="me">Find your name on the roster</label><input id="me" type="search" autocomplete="name" placeholder="Start typing your name" value="' + esc(st.me) + '"></div>';
      var q = st.me.trim().toLowerCase();
      if (q.length >= 3) {
        var hits = roster.filter(function (n) { return n.toLowerCase().indexOf(q) >= 0; }).slice(0, 5);
        if (hits.length) hits.forEach(function (n) { h += '<div class="field" style="flex-direction:row;align-items:center"><span class="val grow">' + esc(n) + '</span><button class="btn" data-act="member" data-v="1" style="min-height:40px;font-size:13px">That’s me</button></div>'; });
        else h += '<div class="field"><span class="note">No match on this team’s roster. You can sign up below.</span></div>';
      }
      h += "</div>";
    } else {
      h += '<button class="btn block" data-act="member" data-v="1">I’m already on this team</button>';
    }

    // Join it
    var pr = programsFor(c);
    h += '<span class="eyebrow">Join ' + esc(c.t.n) + "</span>";
    if (!pr.lid) {
      h += '<div class="card empty">Player sign-up for ' + esc(LNAME[c.l.k]) + " isn’t open on LUG right now. Check the full list of open registrations.</div>";
      return h + '<a class="btn block" target="_blank" rel="noopener" href="https://www.lugsports.com/register">See open registrations</a>';
    }
    var choices = pr.list.length ? pr.list : pr.all;
    var key = c.l.k + "." + c.t.id;
    var pick = (st.prog && st.prog.key === key && choices.filter(function (p) { return p.id === st.prog.id; })[0]) || (pr.list.length === 1 ? pr.list[0] : null);
    h += '<div class="card form">';
    h += '<div class="field"><span class="lab">Team</span><span class="val">' + crest(c.t.n, "sm", c.l.k, c.t.id) + esc(c.t.n) + '<span class="lock">Filled in</span></span></div>';
    h += '<div class="field"><span class="lab">Division</span><span class="val">' + esc(c.d.n) + "</span></div>";
    h += '<div class="field"><span class="lab">League</span><span class="val">' + esc(LNAME[c.l.k]) + "</span></div>";
    if (choices.length > 1 || !pick) {
      h += '<div class="field"><label for="prog">City program</label><select id="prog"><option value="">' + (pr.list.length ? "Choose your program" : "Choose your city") + "</option>" + choices.map(function (p) { return '<option value="' + p.id + '"' + (pick && pick.id === p.id ? " selected" : "") + ">" + esc(titleCase(p.name)) + "</option>"; }).join("") + "</select></div>";
    } else {
      h += '<div class="field"><span class="lab">City program</span><span class="val">' + esc(titleCase(pick.name.split(" - ")[0])) + '<span class="lock">Matched</span></span></div>';
    }
    h += '<div class="field"><span class="lab">Season</span><span class="val">' + esc(pick ? titleCase(pick.name.split(" - ").slice(1).join(" – ")) || c.l.ss : c.l.ss) + "</span></div>";
    h += '<div class="field"><span class="lab">Sign up as</span><span class="val">Player on a captain’s team</span></div>';
    h += "</div>";
    if (pick) {
      h += '<a class="btn pri block" id="go-signup" data-team="' + esc(c.t.n) + '" target="_blank" rel="noopener" href="https://my.hockeyshift.com/#/register/' + pick.id + '">Continue to LUG sign up</a>';
    } else {
      h += '<button class="btn pri block" disabled style="opacity:.5">Choose a city program to continue</button>';
    }
    h += '<ol class="steps"><li>Log in or create your free LUG account.</li><li>On the team step, pick <b>' + esc(c.t.n) + "</b>. We copy the name when you tap Continue, so you can paste it into the search.</li><li>Finish payment to lock in your spot.</li></ol>";
    h += '<p class="note">LUG’s sign-up form runs on HockeyShift behind your LUG login, so this opens your exact city program with the team ready to paste. Playing solo instead? <a target="_blank" rel="noopener" href="https://www.lugsports.com/register#/' + pr.lid + '">Free agent sign-up</a>.</p>';
    return h;
  }
  function tabbar() {
    var tabs = [["home", st.peek ? "Team" : "My Team"], ["schedule", "Schedule"], ["standings", "Standings"], ["points", "Points"], ["roster", "Roster"], ["signup", "Sign Up"]];
    var cur = st.view === "game" ? st.prev : st.view;
    return '<nav class="tabbar" aria-label="Main">' + tabs.map(function (t) { return '<button data-act="tab" data-v="' + t[0] + '"' + (cur === t[0] ? ' aria-current="page"' : "") + ">" + ICON[t[0]] + t[1] + "</button>"; }).join("") + "</nav>";
  }

  function ago(iso) {
    if (!iso) return "";
    var m = Math.round((Date.now() - new Date(iso).getTime()) / 60000);
    if (isNaN(m)) return "";
    if (m < 1) return "just now"; if (m < 60) return m + " min ago";
    var h = Math.round(m / 60); if (h < 24) return h + (h === 1 ? " hour ago" : " hours ago");
    var d = Math.round(h / 24); return d + (d === 1 ? " day ago" : " days ago");
  }
  function footer() {
    var u = DATA.updated || DATA.captured;
    var stale = u && Date.now() - new Date(u).getTime() > 3 * 3600e3;
    return '<p class="foot">' + (stale ? '<span style="color:var(--loss)">' : "<span>") + "Updated " + esc(ago(u)) + '</span> · <button class="linkbtn" data-act="refresh">' + (st.loading ? "Refreshing…" : "Refresh") + "</button><br>Scores and schedules from lugsports.com</p>";
  }
  function render() {
    var html;
    if (!DATA.leagues.length) {
      applyTheme(null);
      root.innerHTML = '<div class="scroll"><div class="topbar"><img class="brandlogo" src="' + LUGLOGO + '" alt="LUG"></div>' + (st.loadErr
        ? '<div class="card empty">Couldn’t load teams and scores. Check your connection and try again.<br><br><button class="btn pri" data-act="refresh">Try again</button></div>'
        : '<div class="card empty">Loading LUG teams, schedules and scores…</div>') + "</div>";
      return;
    }
    if (st.view !== "pick" && !liveSaved().length) st.view = "pick";
    if (saved.length && !findTeam(saved[active].k, saved[active].id)) { var li = saved.findIndex(function (s) { return findTeam(s.k, s.id); }); if (li >= 0) active = li; }
    if (st.view === "pick" || !saved.length) {
      st.view = "pick";
      applyTheme(null);
      html = '<div class="scroll">' + renderPick() + footer() + "</div>";
    } else {
      var c = (st.peek && ctx(st.peek)) || ctx(saved[active]);
      if (!st.peek || !ctx(st.peek)) st.peek = null;
      applyTheme(st.peek ? null : teamTheme(c.l.k, c.t.id));
      var body = st.peek && st.view !== "game" ? renderPeek(c) : st.view === "signup" ? renderSignup(c) : st.view === "schedule" ? renderSchedule(c) : st.view === "standings" ? renderStandings(c) : st.view === "points" ? renderPoints(c) : st.view === "roster" ? renderRoster(c) : st.view === "game" ? renderGame(c) : renderHome(c);
      html = '<div class="scroll">' + body + footer() + "</div>" + (st.peek ? "" : tabbar());
    }
    var focusId = document.activeElement && document.activeElement.id, selEnd = focusId ? document.activeElement.selectionEnd : null;
    root.innerHTML = html;
    if (focusId) { var el = document.getElementById(focusId); if (el) { el.focus(); try { el.setSelectionRange(selEnd, selEnd); } catch (e) {} } }
  }

  root.addEventListener("input", function (e) {
    if (e.target.id === "q" || e.target.id === "q2") { st.pick.q = e.target.value; render(); }
    else if (e.target.id === "me") { st.me = e.target.value; render(); }
  });
  root.addEventListener("change", function (e) {
    if (e.target.id === "prog") { var c = (st.peek && ctx(st.peek)) || ctx(saved[active]); st.prog = { key: c.l.k + "." + c.t.id, id: e.target.value }; render(); }
  });
  root.addEventListener("click", function (e) {
    var go2 = e.target.closest("#go-signup"); if (!go2) return;
    var name = go2.getAttribute("data-team");
    try {
      navigator.clipboard.writeText(name).then(function () { toast("Copied “" + name + "”. Paste it on the team step."); }, function () { toast("Pick “" + name + "” on the team step."); });
    } catch (err) { toast("Pick “" + name + "” on the team step."); }
  });
  root.addEventListener("click", function (e) {
    var b = e.target.closest("[data-act]"); if (!b || b.disabled) return;
    var a = b.getAttribute("data-act"), p = st.pick;
    if (a === "sport") { p.sport = b.getAttribute("data-id"); p.league = p.city = null; p.q = ""; var sp = SPORTS.filter(function (x) { return x.id === p.sport; })[0]; var live = sp.leagues.filter(function (k) { return leagueTeamCount(LEAGUES[k]); }); if (live.length === 1) p.league = live[0]; render(); window.scrollTo(0, 0); }
    else if (a === "league") { p.league = b.getAttribute("data-id"); p.city = null; p.q = ""; render(); window.scrollTo(0, 0); }
    else if (a === "city") { p.city = b.getAttribute("data-id"); render(); window.scrollTo(0, 0); }
    else if (a === "pick-back") { if (p.q) p.q = ""; else if (p.city) p.city = null; else if (p.league) { p.league = null; var s2 = SPORTS.filter(function (x) { return x.id === p.sport; })[0]; if (s2.leagues.filter(function (k) { return leagueTeamCount(LEAGUES[k]); }).length === 1) p.sport = null; } else if (p.sport) p.sport = null; else if (saved.length) { go("home"); return; } render(); }
    else if (a === "team") {
      var k = b.getAttribute("data-k"), id = b.getAttribute("data-id");
      var i = saved.findIndex(function (s) { return s.k === k && s.id === id; });
      var ft = findTeam(k, id);
      if (i < 0) { saved.push({ k: k, id: id, n: ft ? ft.t.n : "" }); i = saved.length - 1; save("lug.saved", saved); }
      active = i; save("lug.active", active);
      st.pick = { sport: null, league: null, city: null, q: "" }; st.sched = "upcoming"; go("home");
    }
    else if (a === "add") { st.peek = null; st.pick = { sport: null, league: null, city: null, q: "" }; go("pick"); }
    else if (a === "switch") { st.peek = null; active = +b.getAttribute("data-i"); save("lug.active", active); go("home"); }
    else if (a === "view-team") {
      e.stopPropagation();
      var vk = b.getAttribute("data-k"), vid = b.getAttribute("data-id");
      var si = saved.findIndex(function (s) { return s.k === vk && s.id === vid; });
      if (si >= 0) { st.peek = null; active = si; save("lug.active", active); }
      else st.peek = { k: vk, id: vid };
      st.sched = "upcoming"; st.me = ""; st.ppts = null; go("home");
    }
    else if (a === "unpeek") { st.peek = null; go("home"); }
    else if (a === "save-peek") { var fp = findTeam(st.peek.k, st.peek.id); saved.push({ k: st.peek.k, id: st.peek.id, n: fp ? fp.t.n : "" }); active = saved.length - 1; save("lug.saved", saved); save("lug.active", active); st.peek = null; toast("Saved to your teams"); go("home"); }
    else if (a === "pts") { var f = b.getAttribute("data-f"), v = b.getAttribute("data-v"), pk = st.peek ? "ppts" : "pts"; st[pk] = st[pk] || { scope: "team", pos: "all", stat: "pts" }; if (f === "more") st[pk].more = true; else { st[pk][f] = v; st[pk].more = false; } render(); }
    else if (a === "member") { var mc = (st.peek && ctx(st.peek)) || ctx(saved[active]); save(memberKey(mc), b.getAttribute("data-v") === "1"); st.me = ""; render(); if (b.getAttribute("data-v") === "1") toast("Marked you as on " + mc.t.n); }
    else if (a === "remove") { saved.splice(active, 1); active = 0; save("lug.saved", saved); save("lug.active", 0); go(saved.length ? "home" : "pick"); }
    else if (a === "tab") { go(b.getAttribute("data-v")); }
    else if (a === "refresh") { loadAll(!DATA.leagues.length, true); }
    else if (a === "sched") { st.sched = b.getAttribute("data-v"); render(); }
    else if (a === "game") { st.game = b.getAttribute("data-id"); st.view = "game"; render(); window.scrollTo(0, 0); }
  });
  // ---------- live data ----------
  var REFRESH_MS = 5 * 60 * 1000, lastFetch = 0;
  function getJSON(url) { return fetch(url + (url.indexOf("?") < 0 ? "?" : "&") + "t=" + Math.floor(Date.now() / 60000), { cache: "no-cache" }).then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); }); }
  function loadAll(first, manual) {
    if (st.loading) return;
    st.loading = true; if (DATA.leagues.length) render();
    var extras = first ? [getJSON("data/logos.json").catch(function () { return LOGOS; }), getJSON("data/reg.json").catch(function () { return REG; })] : [Promise.resolve(LOGOS), Promise.resolve(REG)];
    var prevUpdated = DATA.updated;
    return Promise.all([getJSON("data/data.json")].concat(extras)).then(function (r) {
      LOGOS = r[1] || LOGOS; REG = r[2] || REG;
      indexData(r[0]); resolveSaved();
      st.loadErr = null; lastFetch = Date.now(); st.loading = false;
      render();
      if (manual) toast(DATA.updated !== prevUpdated ? "Updated with the latest scores" : "You’re up to date");
    }).catch(function (e) {
      st.loading = false; st.loadErr = String(e && e.message || e); render();
      if (manual && DATA.leagues.length) toast("Couldn’t refresh. Showing the last scores you loaded.");
    });
  }
  setInterval(function () { if (!document.hidden && Date.now() - lastFetch > REFRESH_MS) loadAll(false); else if (!document.hidden) { var f = root.querySelector(".foot span"); var u = DATA.updated || DATA.captured; if (f && u) f.textContent = "Updated " + ago(u); } }, 30000);
  document.addEventListener("visibilitychange", function () { if (!document.hidden && Date.now() - lastFetch > REFRESH_MS) loadAll(false); });

  // pull down at the top of the page to refresh
  var pull = document.createElement("div"); pull.className = "pull"; pull.setAttribute("aria-hidden", "true"); document.body.appendChild(pull);
  var y0 = null, dy = 0;
  window.addEventListener("touchstart", function (e) { y0 = window.scrollY <= 0 ? e.touches[0].clientY : null; dy = 0; }, { passive: true });
  window.addEventListener("touchmove", function (e) {
    if (y0 == null) return; dy = e.touches[0].clientY - y0;
    if (dy > 10) { pull.style.transform = "translate(-50%," + Math.min(dy, 110) * 0.6 + "px)"; pull.textContent = dy > 80 ? "Release to refresh" : "Pull to refresh"; pull.classList.add("on"); }
  }, { passive: true });
  window.addEventListener("touchend", function () { if (y0 != null && dy > 80) loadAll(false, true); y0 = null; dy = 0; pull.classList.remove("on"); pull.style.transform = ""; }, { passive: true });

  render();
  loadAll(true);
})();
</script>

<script>
if ("serviceWorker" in navigator) { window.addEventListener("load", function () { navigator.serviceWorker.register("sw.js").catch(function () {}); }); }
</script>
